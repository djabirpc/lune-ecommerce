services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luna}
      POSTGRES_USER: ${POSTGRES_USER:-luna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luna} -d ${POSTGRES_DB:-luna}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS_ON_STARTUP:-true}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-luna};Username=${POSTGRES_USER:-luna};Password=${POSTGRES_PASSWORD:-change-me}"
      Jwt__Issuer: ${JWT_ISSUER:-Luna.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Luna.Client}
      Jwt__Key: ${JWT_KEY:?JWT_KEY must be set}
      Jwt__AccessTokenExpiryMinutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-60}
      Jwt__RefreshTokenExpiryDays: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-7}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      InitialAdmin__Email: ${INITIAL_ADMIN_EMAIL:-}
      InitialAdmin__Password: ${INITIAL_ADMIN_PASSWORD:-}
      InitialAdmin__FirstName: ${INITIAL_ADMIN_FIRST_NAME:-}
      InitialAdmin__LastName: ${INITIAL_ADMIN_LAST_NAME:-}
      Yalidine__BaseUrl: ${YALIDINE_BASE_URL:-}
      Yalidine__ApiId: ${YALIDINE_API_ID:-}
      Yalidine__ApiToken: ${YALIDINE_API_TOKEN:-}
      ZRExpress__BaseUrl: ${ZR_EXPRESS_BASE_URL:-}
      ZRExpress__ApiKey: ${ZR_EXPRESS_API_KEY:-}
      ShippingSync__Enabled: ${SHIPPING_SYNC_ENABLED:-true}
      ShippingSync__IntervalSeconds: ${SHIPPING_SYNC_INTERVAL_SECONDS:-300}
      FileStorage__LocalPath: /app/uploads
      FileStorage__PublicBaseUrl: ${BACKEND_PUBLIC_URL:-http://localhost:5000}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      VITE_META_PIXEL_ID: ${VITE_META_PIXEL_ID:-}
      VITE_TIKTOK_PIXEL_ID: ${VITE_TIKTOK_PIXEL_ID:-}
      VITE_INSTAGRAM_URL: ${VITE_INSTAGRAM_URL:-}
      VITE_TIKTOK_URL: ${VITE_TIKTOK_URL:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public

volumes:
  postgres_data:
  uploads_data:
